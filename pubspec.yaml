name: histora
version: 1.0.0+1
publish_to: none
description: Aplikasi pembelajaran sejarah dan negara dunia yang sepenuhnya offline.
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.1
  shared_preferences: ^2.3.5
  share_plus: ^10.1.4
  cupertino_icons: ^1.0.8
  sqflite_common_ffi_web: ^1.2.0
  flutter_earth_globe: ^2.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/flags/
    - assets/images/countries/
    - assets/images/places/
    - assets/images/foods/
